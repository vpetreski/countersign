[project]
name = "countersign"
version = "0.1.0"
description = "An approval-gated AI agent that finds cloud waste, drafts a governed change request and changes nothing until a human countersigns."
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Vanja Petreski", email = "vanja@petreski.co" }]
dependencies = [
    "anthropic>=2.5.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
]

[project.scripts]
countersign = "countersign.cli:main"
countersign-eval = "countersign.evals.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "schemathesis>=4.33.1",
    "time-machine>=3.6.0",
    "types-pyyaml>=6.0.12.20261103",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["countersign"]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.pycodestyle]
max-line-length = 160  # the formatter wraps code at 110; long descriptive strings may run to 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "TRY", "PL", "C4", "PT", "RET", "ARG"]
ignore = [
  "PLR0913",  # explicit keyword arguments are clearer than parameter objects at this size
  "PLR2004",  # thresholds live in named config; small literals in tests are fine
  "TRY003",   # exception messages carry context on purpose
  "S101",     # asserts appear in tests and in invariant checks
  "PLR0911", "PLR0912", "PLR0915",
  "PLR0917",  # keyword-only where it helps readability; not enforced mechanically
  "S311",     # random drives jitter and the seeded simulator only; secrets come from the secrets module
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ARG", "PT011", "PT018"]
"scripts/**" = ["S", "T20", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["countersign"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: a pure function or class, no I/O",
  "integration: several layers together (runtime, store, sandbox) on SQLite",
  "api_success: an API route doing its job",
  "api_validation: an API route refusing malformed input",
  "api_authz: authentication, roles, separation of duties and tenant isolation",
  "api_failure: an API route under a dependency failure or a conflict",
  "data_validation: ingestion catching the planted data defects",
  "claude_contract: the Claude adapter against the Messages API wire format (mocked HTTP, no paid call)",
  "postgres: needs a PostgreSQL server (COUNTERSIGN_TEST_DATABASE_URL)",
  "slow: longer statistical runs",
]
filterwarnings = ["error::DeprecationWarning:countersign.*"]

[tool.coverage.run]
source = ["countersign"]
branch = true
omit = ["countersign/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]

[tool.importlinter]
root_package = "countersign"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "The domain is pure: it imports no other part of the system"
type = "forbidden"
source_modules = ["countersign.domain"]
forbidden_modules = [
  "countersign.data", "countersign.store", "countersign.agent", "countersign.api", "countersign.tools",
  "countersign.execution", "countersign.models", "countersign.evals", "countersign.policy", "countersign.auth",
]

[[tool.importlinter.contracts]]
name = "The policy depends on the domain only"
type = "forbidden"
source_modules = ["countersign.policy"]
forbidden_modules = [
  "countersign.data", "countersign.store", "countersign.agent", "countersign.api", "countersign.tools",
  "countersign.execution", "countersign.models", "countersign.evals", "countersign.auth",
]

[[tool.importlinter.contracts]]
name = "Only the runtime imports the executor: the model, its tools and the API never call it directly"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "countersign.models", "countersign.tools", "countersign.policy", "countersign.data", "countersign.api",
  "countersign.evals",
]
forbidden_modules = ["countersign.execution"]

[[tool.importlinter.contracts]]
name = "The model layer reaches no effects: no store, tools, executor or runtime"
type = "forbidden"
source_modules = ["countersign.models"]
forbidden_modules = [
  "countersign.store", "countersign.tools", "countersign.execution", "countersign.api", "countersign.agent.runtime",
]

[[tool.importlinter.contracts]]
name = "Nothing below the API depends on the API or the evaluation"
type = "forbidden"
source_modules = [
  "countersign.agent", "countersign.tools", "countersign.execution", "countersign.policy", "countersign.data",
  "countersign.store", "countersign.domain", "countersign.models", "countersign.audit", "countersign.auth",
  "countersign.observability", "countersign.security",
]
forbidden_modules = ["countersign.api", "countersign.evals"]
