name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-evals:
    name: deep evals (10 trials, 1000 coverage replicates)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run countersign-eval run --trials 10 --calibration-trials 20 --replicates 1000 --gate --out "$RUNNER_TEMP/deep"
      - uses: actions/upload-artifact@v4
        with:
          name: deep-evals
          path: ${{ runner.temp }}/deep

  api-fuzz:
    name: API property tests (Schemathesis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./fuzz.sqlite3
      COUNTERSIGN_LIVE_PRICES: "false"
      # The fuzzer creates thousands of runs from one address and workspace; lift the hourly limits so its
      # requests reach the run logic instead of stopping at 429 (the limits have their own API tests).
      COUNTERSIGN_RATE_LIMIT_RUNS_PER_HOUR: "1000000"
      COUNTERSIGN_RATE_LIMIT_WORKSPACES_PER_HOUR: "1000000"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run countersign seed
      - name: No input makes the API answer 5xx
        run: |
          uv run uvicorn main:app --port 8000 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health/live && break; sleep 1; done
          TOKEN=$(curl -fs -X POST http://127.0.0.1:8000/api/workspaces | python3 -c "import json,sys; print(json.load(sys.stdin)['tokens']['operator'])")
          uv run schemathesis run http://127.0.0.1:8000/api/openapi.json --checks not_a_server_error --max-examples 150 \
            --exclude-path /api/cron/sync -H "Authorization: Bearer $TOKEN"

  live-claude:
    name: Claude on the same cases (skipped without a key)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Contract tests always run; the live evaluation only with a repository secret
        run: |
          uv run pytest -q -m claude_contract
          uv run countersign-eval run --model claude --trials 1 --no-mutants --no-calibration --out "$RUNNER_TEMP/claude"

  live-checks:
    name: Live contracts (Azure Retail Prices API, the deployed app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the deploy check reads which commit last changed the app
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Every snapshot price still comes back live, trusted and within 25%
        run: uv run python scripts/check_live_prices.py
      - name: The deployed app is ready, keyless, and runs the latest deployable commit
        run: |
          base=https://countersign-agent.vercel.app
          curl -fsS "$base/api/health/ready" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status'] == 'ok', d; print('ready')"
          want=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%H -- backend frontend vercel.json)
          curl -fsS "$base/api/config" | WANT="$want" python3 -c "import json,os,sys; d=json.load(sys.stdin); assert d['model']['provider'] == 'offline', d['model']; assert d['build']['sha'] == os.environ['WANT'], (d['build'], os.environ['WANT']); print('keyless, build', d['build']['sha'][:7])"
